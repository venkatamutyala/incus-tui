name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Manual approval gate: cutting a release requires a click in the protected
  # "release" environment, so a leaked token / rogue tag push can't ship on its own.
  approve:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - run: echo "Release ${{ github.ref_name }} approved."

  goreleaser:
    needs: approve
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # keyless cosign / attestations (ambient GitHub OIDC token)
      attestations: write # SLSA build-provenance attestations
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      # cosign-installer v4.1.2 ships cosign v3.x, whose sign-blob writes a single
      # Sigstore bundle (checksums.txt.bundle) — see the signs block in .goreleaser.yaml.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # SLSA build-provenance for the release archives (verify: gh attestation verify).
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*.tar.gz"
      # Publish the draft GoReleaser created. GitHub "immutable releases" rejects asset uploads to a
      # published release (422), so .goreleaser.yaml sets release.draft: true and attaches all
      # artifacts to the draft first; flipping draft→published here is the atomic step that makes the
      # release (and its assets) immutable. Must run only after every artifact is attached above.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"

  docker:
    needs: approve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # attestations OIDC
      attestations: write # SLSA build-provenance for the image
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # metadata-action's version has the leading "v" stripped, matching the
          # GoReleaser binaries (1.2.3, not v1.2.3).
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # SLSA build-provenance for the multi-arch image (one attestation on the index
      # digest covers all platforms). Verify: gh attestation verify oci://… --repo …
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
